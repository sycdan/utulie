name: Promote to latest

# Retags an already-published, already-tested image as `latest` -- no rebuild,
# so what production pulls is byte-identical to what publish.yml built and
# tested. Manual only: moving `latest` is a deliberate act, never a side
# effect of pushing a tag.
#
#   gh workflow run promote.yml -f tag=v2026.9.22 --repo sycdan/utulie
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published tag to promote (with or without the v prefix)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as latest, no rebuild
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          tag="${RAW_TAG#v}"
          image="${REGISTRY}/${IMAGE_NAME,,}"
          docker buildx imagetools create -t "${image}:latest" "${image}:${tag}"
          echo "Promoted ${image}:${tag} -> ${image}:latest"
