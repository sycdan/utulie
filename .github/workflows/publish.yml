name: Publish image

# Every v* tag: pytest, then build+push to GHCR tagged as the exact tag string.
# No prerelease/release split like gogglebox uses -- utulie has one deployment
# target and no external consumers needing SemVer discipline, so there is
# nothing to promote *from*. Every tag is a real, independently pullable build
# (see etc/utulie/docker-compose.rc.yml in my-home-server for testing one
# without touching production).
#
# `latest` is never set here. Moving it is a separate, deliberate action --
# see promote.yml -- so production's UTULIE_VERSION=latest never moves just
# because a prerelease tag was pushed to try something out.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt
      - run: pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image ref
        id: image
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${RAW_TAG#v}"
          image="${REGISTRY}/${IMAGE_NAME}"
          echo "ref=${image,,}:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
